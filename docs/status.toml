id = "D1"
text = "協作模式:task 由 Claude Code 實作、你審(repo CLAUDE.md 合約生效),還是 Mode A 你手寫 Rust?"
bites = "決定 W2–W6 誰動手;也決定下方人時欄怎麼讀。"

[[decision]]
id = "D2"
text = "task 順序:rows-as-data generator(W10)排到 worker 之後?"
bites = "它不在 v0 閉環關鍵路徑上;剩餘 46 天只夠 v0。"

[[decision]]
id = "D3"
text = "C15 的「v1 核心」指哪些 ID?建議 = I14(macOS 跑得起來)+ B2(Tier 0 triage 收編,已有原型),其餘 v1 入職後按 C14 解鎖。"
bites = "沒定義就無法判斷 10-05 前算不算達標;估時顯示 v0 本身已吃掉全部剩餘時間。"

