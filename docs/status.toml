# status.toml — v0 對齊板的資料源(rows-as-data)。改這裡,跑
# `python3 experiments/gen_status.py` 重生 docs/status.html;review 看這份 diff。
# 狀態詞彙(req.status):delivered(repo 有且驗過)/ spec-only(合約在、跑不起來)/
# planned(有工作項認領、尚無實物)/ gap(spec 包交付時無人認領,本板新增工作項)/ policy。
schema_version = 1
as_of = "2026-08-20"
deadline = "2026-10-05"     # C15 build window
source = "docs/requirements-v1.6.html"
north_star = "入職 Etched 後常態週工時中位數 ≤ 8 小時/天;系統產品是 attention allocation。"
v0_acceptance = "Claude Code session 結束或 pre-push 後幾分鐘,帶 requirement↔span 矩陣與 risk ranking 的 dossier 自動出現在通知裡;文字保證無 script 漏字。"
hours_note = "人時為 Withers 手寫估;若由 Claude Code 實作,Withers 端換算成 review 時數約 1/3。"

# ---- 待你拍板(鏡像 NOW.md Blocked-on;改動以 NOW.md 為準) ----
